name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: aimetamere
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zoom snake SVGs (1.5x)
        run: |
          node <<'EOF'
          const fs = require("fs");

          const files = ["dist/github-snake.svg", "dist/github-snake-dark.svg"];
          const zoom = 1.5;

          for (const file of files) {
            let svg = fs.readFileSync(file, "utf8");
            const match = svg.match(/viewBox="([^"]+)"/);
            if (!match) continue;

            const [minX, minY, width, height] = match[1].split(/\s+/).map(Number);
            const newWidth = width / zoom;
            const newHeight = height / zoom;
            const newMinX = minX + (width - newWidth) / 2;
            const newMinY = minY + (height - newHeight) / 2;
            const newViewBox = `${newMinX} ${newMinY} ${newWidth} ${newHeight}`;

            svg = svg.replace(/viewBox="[^"]+"/, `viewBox="${newViewBox}"`);
            fs.writeFileSync(file, svg, "utf8");
          }
          EOF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}